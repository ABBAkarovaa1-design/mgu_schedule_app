<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>МГУ — Админ</title><style>
body{margin:0;background:#100d12;color:#eee;font:15px system-ui;padding:20px;max-width:1000px;margin:auto}.box{background:#1b161d;border:1px solid #352a33;border-radius:16px;padding:18px;margin:12px 0}h1{margin-top:0}input,select,button{padding:10px;border-radius:9px;border:1px solid #40333d;background:#251e27;color:white;margin:4px}button{cursor:pointer;background:#7e1638;border-color:#a5224d}.danger{background:#54202f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px}.muted{color:#aaa}.row{border-bottom:1px solid #332933;padding:8px 0}
</style></head><body><h1>МГУ • Управление расписанием</h1><div class="box"><h3>Импорт Excel</h3><p class="muted">Колонки: group, day, start, end, subject, teacher, room, faculty, week, lesson_type, note</p><input id="file" type="file" accept=".xlsx"><button onclick="imp()">Импортировать</button><span id="status"></span></div>
<div class="box"><h3>Группы</h3><input id="gn" placeholder="Название группы"><input id="gf" placeholder="Факультет"><button onclick="addGroup()">Добавить</button><div id="groups"></div></div>
<div class="box"><h3>Добавить пару</h3><div class="grid"><select id="gid"></select><select id="day">${["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"].map(x=>`<option>${x}</option>`).join("")}</select><input id="start" placeholder="09:00"><input id="end" placeholder="10:30"><input id="sub" placeholder="Предмет"><input id="teacher" placeholder="Преподаватель"><input id="room" placeholder="Аудитория"><input id="type" placeholder="Тип"><input id="note" placeholder="Примечание"><input id="week" type="number" value="0" placeholder="Неделя"></div><button onclick="addLesson()">Добавить пару</button></div>
<div class="box"><h3>Пары выбранной группы</h3><div id="lessons"></div></div>
<div class="box"><button onclick="backup()">💾 Сделать резервную копию БД</button><form method="post" action="/admin/logout" style="display:inline"><button>Выйти</button></form></div>
<script>
async function api(u,o){let r=await fetch(u,o);return r.json()}async function load(){let gs=await api("/api/admin/groups");gid.innerHTML=gs.map(g=>`<option value="${g.id}">${g.name}</option>`).join("");groups.innerHTML=gs.map(g=>`<div class="row">${g.name} <span class="muted">${g.faculty||""}</span> <button class="danger" onclick="delG(${g.id})">Удалить</button></div>`).join("");loadLessons()}async function addGroup(){await api("/api/admin/groups",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:gn.value,faculty:gf.value})});gn.value="";gf.value="";load()}async function delG(id){if(confirm("Удалить группу и все её пары?")){await api("/api/admin/groups/"+id,{method:"DELETE"});load()}}async function loadLessons(){if(!gid.value)return;let ls=await api("/api/admin/all-lessons?group_id="+gid.value);lessons.innerHTML=ls.map(x=>`<div class="row"><b>${x.day}</b> ${x.start}-${x.end} — ${x.subject} — ${x.teacher||"—"} — ${x.room||"—"} <button class="danger" onclick="delL(${x.id})">Удалить</button></div>`).join("")}async function addLesson(){await api("/api/admin/lessons",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({group_id:+gid.value,day:day.value,start:start.value,end:end.value,subject:sub.value,teacher:teacher.value,room:room.value,lesson_type:type.value,note:note.value,week:+week.value})});loadLessons()}async function delL(id){await api("/api/admin/lessons/"+id,{method:"DELETE"});loadLessons()}async function imp(){let f=file.files[0];let fd=new FormData();fd.append("file",f);let r=await fetch("/api/admin/import",{method:"POST",body:fd});let x=await r.json();status.textContent=x.error||(" Импортировано: "+x.imported);load()}async function backup(){let x=await api("/api/admin/backup",{method:"POST"});alert(x.file?"Создано: "+x.file:"Ошибка")}gid.onchange=loadLessons;load()
</script></body></html>
